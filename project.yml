name: TraceAI

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    exactVersion: 4.19.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TraceAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TraceAI
    dependencies:
      - package: SuperwallKit
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.traceai # TODO: set your real bundle ID
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: TraceAI/Info.plist # generated by xcodegen; do not edit by hand
      properties:
        CFBundleDisplayName: TraceAI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: TraceAI shows your paper through the camera so you can trace the stencil, and detects the paper edges and your hand on your device. Video never leaves your iPhone.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
